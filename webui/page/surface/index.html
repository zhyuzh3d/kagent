<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surface 加载器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1>Surface 加载器<span class="sub">从分类列表选择可用 Surface，并查看它主动上报的动作定义与事件回报</span></h1>
      <select id="surfaceSelect" class="mono surface-select" aria-label="选择 Surface"></select>
      <button id="loadBtn" class="primary">加载</button>
      <span id="statusBadge" class="badge">READY</span>
    </div>

    <div class="layout">
      <section class="card">
        <h2>Surface 运行区</h2>
        <div class="body">
          <div class="kv">
            <label>Surface</label><div id="surfaceMeta" class="mono">-</div>
            <label>入口</label><div id="entryMeta" class="mono">-</div>
            <label>会话</label>
            <div id="sessionMeta" class="session-text">
              <span class="mono">-</span>
            </div>
          </div>
          <iframe id="surfaceFrame" sandbox="allow-scripts allow-downloads"></iframe>
        </div>
      </section>

      <section class="card">
        <h2>动作 / 事件</h2>
        <div class="body stack">
          <div class="row">
            <span id="actionsBadge" class="pill">动作：0</span>
            <span class="hint">动作列表由当前 Surface 通过事件主动上报，右侧 schema 会随选择同步更新。</span>
          </div>
          <div class="action-grid">
            <select id="actionSelect"></select>
            <pre id="actionSchema" class="mono">暂无动作 schema</pre>
            <textarea id="actionEditor" class="mono">{"id":"demo-act","name":"","args":{}}</textarea>
          </div>
          <div class="row">
            <button id="dispatchBtn" class="primary">发送动作</button>
            <button id="runtimeBtn">运行状态</button>
            <button id="logsBtn">日志</button>
          </div>
          <pre id="eventLog" class="mono event-log">（空）</pre>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="./components/app.js"></script>
</body>
</html>
