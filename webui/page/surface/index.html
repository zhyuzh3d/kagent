<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surface Runtime</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1117;
    }

    body {
      display: block;
      background: #0b1117;
    }

    .surface-runtime-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    .surface-runtime-root iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .surface-hidden-support {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="surface-runtime-root">
    <iframe id="surfaceFrame" sandbox="allow-scripts allow-same-origin allow-downloads" src="about:blank"></iframe>
  </main>

  <div class="surface-hidden-support" aria-hidden="true">
    <select id="surfaceSelect"></select>
    <button id="loadBtn" type="button">load</button>
    <button id="resetLayoutBtn" type="button">reset</button>
    <button id="refreshFrameBtn" type="button">refresh</button>
    <button id="clearLogsBtn" type="button">clear logs</button>
    <button id="dispatchBtn" type="button">dispatch</button>

    <nav id="tabsNav">
      <button class="tab-btn active" data-tab="overview" type="button">overview</button>
      <button class="tab-btn" data-tab="actions" type="button">actions</button>
      <button class="tab-btn" data-tab="status" type="button">status</button>
    </nav>

    <nav id="actionTabsNav">
      <button class="inner-tab-btn" data-inner-tab="schema" type="button">schema</button>
      <button class="inner-tab-btn active" data-inner-tab="json" type="button">json</button>
    </nav>

    <div id="tab-overview" class="tab-pane active"></div>
    <div id="tab-actions" class="tab-pane"></div>
    <div id="tab-status" class="tab-pane"></div>
    <div id="inner-tab-schema" class="inner-tab-pane"></div>
    <div id="inner-tab-json" class="inner-tab-pane active"></div>

    <span id="previewStatus">未加载</span>
    <div id="surfaceMeta">-</div>
    <div id="entryMeta">-</div>
    <div id="sessionMeta">-</div>
    <div id="capabilitiesList"></div>
    <span id="actionsBadge">0</span>
    <select id="actionSelect"></select>
    <pre id="actionSchema">暂无动作 schema</pre>
    <textarea id="actionEditor" spellcheck="false">{}</textarea>
    <pre id="runtimeStatus">等待查询...</pre>
    <pre id="eventLog">（空）</pre>
  </div>

  <div id="toastViewport" class="toast-viewport" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./components/app.js"></script>
</body>
</html>
