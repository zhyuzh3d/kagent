<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hub 服务治理控制台</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-left">
      <div>
        <h1>Hub 治理中心</h1>
      </div>
      <div class="header-tabs">
        <button class="header-tab active" data-tab="services">
          服务列表 <span class="tab-badge" id="serviceCount">0</span>
        </button>
        <button class="header-tab" data-tab="tools">
          工具全集 <span class="tab-badge" id="totalToolsCount">0</span>
        </button>
      </div>
      <span id="statusBadge" class="status-badge">就绪</span>
    </div>
    <div class="header-right">
      <button id="refreshBtn" class="action-btn">刷新列表</button>
      <button id="openGeneratorBtn" class="action-btn primary" style="display: none;">创建新服务</button>
    </div>
  </header>

  <main class="main-container">
    <section class="overview-grid">
      <article class="overview-card">
        <span class="overview-label">托管服务</span>
        <strong id="managedCount" class="overview-value">0</strong>
        <p>来自 `hub/config/services.json` 的受管服务条目。</p>
      </article>
      <article class="overview-card">
        <span class="overview-label">运行中实例</span>
        <strong id="liveCount" class="overview-value">0</strong>
        <p>当前已注册且处于 active 的服务实例。</p>
      </article>
      <article class="overview-card">
        <span class="overview-label">健康实例</span>
        <strong id="healthyCount" class="overview-value">0</strong>
        <p>最近心跳健康且仍可参与路由的实例。</p>
      </article>
      <article class="overview-card warning">
        <span class="overview-label">高风险工具</span>
        <strong id="riskyCount" class="overview-value">0</strong>
        <p>风险等级 `>= 4` 的工具，需要重点治理。</p>
      </article>
    </section>

    <section id="sectionServices" class="tab-section active">
      <div class="table-card">
        <div class="table-scroll">
          <table id="serviceTable" style="table-layout: fixed; width: 100%;">
            <thead>
              <tr>
                <th style="width: 28%">服务</th>
                <th style="width: 110px">运行态</th>
                <th style="width: 240px">实例 / Endpoint</th>
                <th style="width: 90px">健康度</th>
                <th>版本 / 运行文件</th>
                <th style="width: 240px;text-align: right;">操作</th>
              </tr>
            </thead>
            <tbody id="serviceTableBody">
              <!-- Dynamic rows -->
            </tbody>
          </table>
        </div>
        <div id="serviceEmptyMsg" class="empty-state" style="display: none;">
          <h3>未发现托管服务</h3>
          <p>请确保 Hub 已正确配置且相关服务已启动。</p>
        </div>
      </div>
    </section>

    <!-- Tools Section -->
    <section id="sectionTools" class="tab-section">
      <div class="table-card">
        <div class="table-scroll">
          <table id="toolsTable" style="table-layout: fixed; width: 100%;">
            <thead>
              <tr>
                <th style="width: 300px">工具 ID</th>
                <th>声明能力 / 描述</th>
                <th style="width: 140px">所属服务</th>
                <th style="width: 120px">范式 / 健康</th>
                <th style="width: 100px; text-align: right;">操作</th>
              </tr>
            </thead>
            <tbody id="toolsTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
        <div id="toolsEmptyMsg" class="empty-state" style="display: none;">
          <h3>暂无注册工具</h3>
          <p>集群内尚未发现任何已注册的原子工具。</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Generator Modal (New Service) -->
  <div id="genModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>创建新服务</h3>
        <button id="closeGenBtn" class="btn-close">&times;</button>
      </div>
      <div id="genModalBody" class="modal-body">
        <!-- Content from tpl-generator -->
      </div>
      <div class="modal-footer">
        <button id="cancelGenBtn" class="action-btn">取消</button>
        <button id="runGenBtn" class="action-btn primary">生成并初始化</button>
      </div>
    </div>
  </div>

  <!-- Side Drawer -->
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <div id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <div class="header-info">
        <h2 id="drawerTitle">服务详情</h2>
        <span id="drawerSubTitle" class="mono drawer-subtitle"></span>
      </div>
      <button id="closeDrawerBtn" class="btn-close">&times;</button>
    </div>

    <div class="drawer-tabs">
      <button class="tab-btn active" data-tab="governance">治理配置</button>
      <button class="tab-btn" data-tab="lifecycle">生命周期</button>
      <button class="tab-btn" data-tab="tools">工具列表</button>
      <button class="tab-btn" data-tab="config">配置管理</button>
      <button class="tab-btn" data-tab="ops">运维与审计</button>
      <button class="tab-btn" data-tab="files">文件浏览</button>
    </div>

    <div id="drawerContent" class="drawer-content">
      <!-- Content injected here -->
    </div>

    <div class="drawer-footer">
      <button id="drawerCancelBtn" class="action-btn">关闭</button>
      <button id="drawerSaveBtn" class="action-btn primary" style="display: none;">保存修改</button>
    </div>
  </div>

  <template id="tpl-governance">
    <div class="tab-pane">
      <div id="govInfo" class="action-card summary-card"></div>
      <div class="action-card">
        <h4>治理操作</h4>
        <div class="button-row">
          <button id="govToggleBtn" class="action-btn"></button>
          <button id="govBuildBtn" class="action-btn" style="margin-left: auto;">构建 (Build)</button>
          <button id="govDrainBtn" class="action-btn" style="color: var(--warn);">排线 (Drain)</button>
        </div>
      </div>
      <div class="action-card stacked-card">
        <h4>Hub 治理配置</h4>
        <label style="display:block; margin-bottom: 14px;">
          <div class="summary-label" style="margin-bottom: 8px;">可靠度</div>
          <select id="govReliabilitySelect" class="mono config-type-select" style="width: 100%;">
            <option value="trusted">trusted · 官方可信</option>
            <option value="verified">verified · 已验证</option>
            <option value="unverified">unverified · 未验证</option>
            <option value="risky">risky · 有风险</option>
            <option value="high_risk">high_risk · 高风险</option>
          </select>
        </label>
        <p class="cell-note" style="margin-top: 14px;">
          这里是 Hub 侧 service 治理事实源。tool 选择打分会继承这里的 reliability，service manifest 不再自声明该字段。
        </p>
      </div>
    </div>
  </template>

  <template id="tpl-tools">
    <div class="tab-pane">
      <div id="toolsListContainer" class="tools-list">
        <!-- Tool items populated here -->
      </div>
    </div>
  </template>

  <template id="tpl-lifecycle">
    <div class="tab-pane">
      <div id="serviceMetadata" class="action-card summary-card"></div>
      <div class="action-card">
        <h4>运行时控制</h4>
        <div class="button-row">
          <button class="action-btn" data-action="start">▶ 启动进程</button>
          <button class="action-btn" data-action="stop">■ 停止进程</button>
          <button class="action-btn" data-action="restart">↻ 重启服务</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-config">
    <div class="tab-pane">
      <div class="config-selector config-selector-row">
        <select id="configTypeSelect" class="mono config-type-select">
          <option value="config">核心配置 (config.json)</option>
          <option value="configx">敏感密钥 (configx.json)</option>
          <option value="startup_manifest">启动清单 (manifest.json)</option>
          <option value="runtime_manifest">运行时事实 (manifest_runtime.json)</option>
        </select>
      </div>
      <textarea id="configEditor" class="editor mono config-editor" style="margin-top: 8px;"></textarea>
    </div>
  </template>

  <template id="tpl-generator">
    <div class="generator-container">
      <div style="margin-bottom: 16px;">
        <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 8px;">服务 ID (Slug)</label>
        <input id="genName" placeholder="例如: ai_helper_service"
          style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px;" />
      </div>
      <div>
        <label style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 8px;">Prompt 指令</label>
        <textarea id="genPrompt" class="editor mono"
          style="min-height: 200px;">创建一个可被 Hub 管理的自定义 service，需实现 echo 示例工具。</textarea>
      </div>
      <div style="margin-top: 16px; display: flex; gap: 12px;">
        <label><input type="checkbox" id="genBuildFlag" checked /> 生成后自动构建</label>
      </div>
    </div>
  </template>

  <template id="tpl-ops">
    <div class="tab-pane">
      <div class="action-card">
        <h4>工具探测 (Probe)</h4>
        <div class="probe-row">
          <input id="pToolID" class="mono probe-input" placeholder="service.lifecycle.state.get" />
        </div>
        <textarea id="pArgs" class="editor mono probe-editor" placeholder='{"args":{}}'>{}</textarea>
        <button id="pRunBtn" class="action-btn primary">执行探测</button>
        <div class="probe-output-wrap">
          <pre id="pOutput" class="mono result-box probe-output"></pre>
        </div>
      </div>
      <div class="action-card stacked-card">
        <h4>审计日志回溯</h4>
        <button id="auditBtn" class="action-btn">加载历史审计数据</button>
        <pre id="auditOutput" class="mono result-box audit-output"></pre>
      </div>
    </div>
  </template>

  <template id="tpl-files">
    <div class="files-container">
      <div class="files-toolbar">
        <select id="fSelect" class="files-select"></select>
        <button id="fLoadBtn" class="action-btn" style="margin:0 0 10px 0;">加载文件内容</button>
      </div>
      <textarea id="fEditor" class="editor mono files-editor"></textarea>
    </div>
  </template>

  <script type="module" src="admin.js"></script>
</body>

</html>
