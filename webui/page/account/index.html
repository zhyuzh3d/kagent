<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kagent - 账户</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel2: #22252f;
      --text: #e2e8f0;
      --muted: #8892a4;
      --line: #2d3244;
      --accent: #6366f1;
      --accent2: #818cf8;
      --err: #ef4444;
      --ok: #22c55e;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: min(92vw, 400px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 28px 28px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    .auth-card.logged-in {
      width: min(92vw, 460px);
    }

    .auth-card h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent2);
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card .subtitle {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent2);
    }

    .error-text {
      color: var(--err);
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 8px;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent2);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .switch-mode {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .switch-mode a {
      color: var(--accent2);
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .switch-mode a:hover {
      text-decoration: underline;
    }

    .confirm-group {
      display: none;
    }

    .confirm-group.visible {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .account-view {
      display: none;
    }

    .account-view.visible {
      display: block;
    }

    .account-info {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--panel2);
      border: 1px solid var(--line);
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .info-value {
      display: block;
      font-size: 15px;
      color: var(--text);
      word-break: break-all;
    }

    .action-row {
      display: flex;
      gap: 12px;
    }

    .action-row .submit-btn {
      width: auto;
      flex: 1;
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body>
  <div id="authCard" class="auth-card">
    <h1 id="title">登录</h1>
    <div class="subtitle">kagent 实时对话系统</div>

    <form id="authForm" autocomplete="off">
      <div class="form-group">
        <label for="username">用户名</label>
        <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码（至少6位）" autocomplete="current-password" required />
      </div>
      <div id="confirmGroup" class="form-group confirm-group">
        <label for="confirmPassword">确认密码</label>
        <input id="confirmPassword" type="password" placeholder="请再次输入密码" autocomplete="new-password" />
      </div>
      <div id="errorText" class="error-text"></div>
      <button id="submitBtn" type="submit" class="submit-btn">登录</button>
    </form>

    <div class="switch-mode">
      <span id="switchHint">还没有账号？</span>
      <a id="switchLink" href="javascript:void(0)">注册</a>
    </div>

    <div id="accountView" class="account-view">
      <div class="account-info">
        <div class="info-item">
          <span class="info-label">用户名</span>
          <span id="profileUsername" class="info-value">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">用户 ID</span>
          <span id="profileUserId" class="info-value">-</span>
        </div>
      </div>
      <div id="profileError" class="error-text"></div>
      <div class="action-row">
        <button id="goChatBtn" type="button" class="submit-btn secondary-btn">进入聊天</button>
        <button id="logoutBtn" type="button" class="submit-btn">退出登录</button>
      </div>
    </div>
  </div>

  <script>
    let isRegister = false;

    const authCard = document.getElementById('authCard');
    const titleEl = document.getElementById('title');
    const confirmGroup = document.getElementById('confirmGroup');
    const confirmInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const switchHint = document.getElementById('switchHint');
    const switchLink = document.getElementById('switchLink');
    const switchMode = document.querySelector('.switch-mode');
    const errorText = document.getElementById('errorText');
    const authForm = document.getElementById('authForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const accountView = document.getElementById('accountView');
    const profileUsername = document.getElementById('profileUsername');
    const profileUserId = document.getElementById('profileUserId');
    const profileError = document.getElementById('profileError');
    const logoutBtn = document.getElementById('logoutBtn');
    const goChatBtn = document.getElementById('goChatBtn');

    // Only redirect when caller explicitly passes a redirect target.
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    async function callAccountTool(toolID, args = {}) {
      const resp = await fetch('/api/tool/call', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tool_id: toolID, args }),
      });
      const raw = await resp.text();
      let data = null;
      try {
        data = raw ? JSON.parse(raw) : null;
      } catch (_) {
        data = null;
      }
      return { resp, data };
    }

    function setLoggedInView(user) {
      authCard.classList.add('logged-in');
      authForm.classList.add('hidden');
      switchMode.classList.add('hidden');
      accountView.classList.add('visible');
      titleEl.textContent = '账户信息';
      profileUsername.textContent = user && user.username ? user.username : '-';
      profileUserId.textContent = user && user.user_id ? user.user_id : '-';
      profileError.textContent = '';
    }

    function setLoggedOutView() {
      authCard.classList.remove('logged-in');
      authForm.classList.remove('hidden');
      switchMode.classList.remove('hidden');
      accountView.classList.remove('visible');
      profileUsername.textContent = '-';
      profileUserId.textContent = '-';
      profileError.textContent = '';
      setMode(false);
    }

    function setMode(register) {
      isRegister = register;
      titleEl.textContent = register ? '注册' : '登录';
      submitBtn.textContent = register ? '注册' : '登录';
      switchHint.textContent = register ? '已有账号？' : '还没有账号？';
      switchLink.textContent = register ? '登录' : '注册';
      confirmGroup.classList.toggle('visible', register);
      if (!register) confirmInput.value = '';
      errorText.textContent = '';
    }

    switchLink.addEventListener('click', () => {
      setMode(!isRegister);
    });

    goChatBtn.addEventListener('click', () => {
      window.location.href = redirectUrl || '/page/chat/';
    });

    logoutBtn.addEventListener('click', async () => {
      profileError.textContent = '';
      logoutBtn.disabled = true;
      try {
        const { resp, data } = await callAccountTool('account.auth.logout', {});
        if (!resp.ok || !data || data.ok !== true) {
          profileError.textContent = data && data.error && data.error.message
            ? data.error.message
            : '退出失败，请重试';
          return;
        }
        setLoggedOutView();
      } catch (_) {
        profileError.textContent = '退出失败，请重试';
      } finally {
        logoutBtn.disabled = false;
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorText.textContent = '';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username) {
        errorText.textContent = '请输入用户名';
        return;
      }
      if (password.length < 6) {
        errorText.textContent = '密码至少需要6位';
        return;
      }

      if (isRegister) {
        if (password !== confirmInput.value) {
          errorText.textContent = '两次输入的密码不一致';
          return;
        }
      }

      submitBtn.disabled = true;
      try {
        const toolID = isRegister ? 'account.auth.register' : 'account.auth.login';
        const { resp, data } = await callAccountTool(toolID, { username, password });
        if (resp.ok && data && data.ok === true) {
          if (redirectUrl) {
            window.location.href = redirectUrl;
            return;
          }
          passwordInput.value = '';
          confirmInput.value = '';
          usernameInput.value = '';
          setLoggedInView(data.result || { username, user_id: '' });
        } else {
          const message = data && data.error && data.error.message
            ? data.error.message
            : '操作失败，请重试';
          errorText.textContent = message;
        }
      } catch (err) {
        errorText.textContent = '网络错误，请重试';
      } finally {
        submitBtn.disabled = false;
      }
    });

    (async function checkAuth() {
      try {
        const { resp, data } = await callAccountTool('account.auth.me', {});
        if (resp.ok && data && data.ok === true && data.result) {
          setLoggedInView(data.result);
          return;
        }
      } catch (_) { }
      setLoggedOutView();
    })();
  </script>
</body>

</html>
