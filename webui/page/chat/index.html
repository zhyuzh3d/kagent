<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T0 MVP - 实时语音对话</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/sidebar.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/chat.css" />
  <link rel="stylesheet" href="./styles/debug-panel.css" />
  <link rel="stylesheet" href="./styles/config-drawer.css" />
  <link rel="stylesheet" href="./styles/surface-window.css" />
  <link rel="stylesheet" href="./styles/user-menu.css" />
</head>

<body>
  <aside id="sidebar" class="sidebar">
    <!-- Sidebar content will be rendered here by sidebar-controller.js -->
    <div class="sidebar-loading">Loading projects...</div>
  </aside>

  <main class="main-container">
    <div class="header">
      <div class="header-left">
        <button id="sidebarToggle" class="btn-toggle" title="切换边栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div id="currentPath" class="current-path">
          <span id="currentProjectName">Default Project</span>
          <span class="path-sep">/</span>
          <span id="currentThreadName">Default Thread</span>
        </div>
      </div>
      <div id="versionText" class="version-text"></div>
      <div id="statusDot" class="status-dot"></div>
      <div id="statusText" class="status-text">Idle</div>
      <button id="configBtn" class="btn-config">配置</button>
      <select id="surfaceSelect" class="surface-select" aria-label="选择 Surface">
        <option value="">请选择Surface...</option>
      </select>
      <button id="showMoreBtn" class="btn-ghost">Show More: Off</button>
      <button id="startBtn" class="btn-start">开始对话</button>
      <button id="stopBtn" class="btn-stop" disabled>停止</button>
      <div class="user-avatar-wrapper">
        <button id="userAvatarBtn" class="user-avatar-btn" title="用户"></button>
        <div id="userMenu" class="user-menu">
          <div id="userMenuName" class="user-menu-name"></div>
          <div id="logoutBtn" class="user-menu-item">退出登录</div>
        </div>
      </div>
    </div>

    <div id="chatWorkspace" class="chat-workspace">
      <div class="chat-main-pane">
        <div id="chatArea" class="chat-area"></div>
      </div>
      <div id="surfaceDockShell" class="surface-dock-shell">
        <div id="surfaceDockResize" class="surface-dock-resize" aria-hidden="true"></div>
        <div id="surfaceDockHost" class="surface-dock-host"></div>
      </div>
    </div>
    <div id="configShell" class="config-shell"></div>
    <div id="surfaceFloatRoot" class="surface-float-root"></div>

    <div class="resize-handle" id="resizeHandle"></div>
    <div class="debug-toggle" id="debugToggle">▶ 调试日志</div>
    <div class="debug-panel" id="debugPanel">
      <pre id="debug"></pre>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
