<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Surface</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="task-shell">
    <section class="task-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Execution Surface</p>
          <h1>Task Board</h1>
        </div>
        <span id="statusChip" class="status-chip">idle</span>
      </div>
      <div class="composer">
        <input id="taskInput" type="text" placeholder="新增任务，例如 打开 doubao.com" />
        <button id="addTaskBtn" type="button">添加</button>
      </div>
      <div class="task-columns">
        <section>
          <h2>Tasks</h2>
          <div id="taskList" class="task-list"></div>
        </section>
        <section>
          <h2>Timeline</h2>
          <div id="timelineList" class="timeline-list"></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
