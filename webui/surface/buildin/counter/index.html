<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counter Surface</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="counter-shell">
    <section class="counter-card">
      <p class="eyebrow">Surface Demo</p>
      <h1>Counter</h1>
      <div id="countValue" class="count-value">0</div>
      <div class="counter-actions">
        <button id="decBtn" type="button">-1</button>
        <button id="resetBtn" type="button">Reset</button>
        <button id="incBtn" type="button" class="primary">+1</button>
      </div>
      <button id="flashBtn" type="button" class="ghost">Host Flash</button>
      <pre id="stateText" class="state-box">等待宿主连接…</pre>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
